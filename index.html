<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hassan Raza | Portfolio</title>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* GLOBAL STYLES */
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', Arial, sans-serif;
  background-color: #fcefd2; /* Outer background accent color matching the image */
  color: #222;
}

.page-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  background: #fff;
  box-shadow: 0 0 30px rgba(0,0,0,0.05);
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 60px;
  background: #fffef9;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: #111;
}

.logo span {
  color: #6366f1; /* Small dot color accent */
  font-size: 26px;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 30px;
  align-items: center;
}

nav ul li a {
  text-decoration: none;
  color: #444;
  font-size: 14px;
  font-weight: 600;
  transition: color 0.3s;
}

nav ul li a:hover {
  color: #f4b400;
}

.btn-coffee {
  background: #f4b400;
  color: #fff !important;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px !important;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 10px rgba(244, 180, 0, 0.3);
}

/* HERO SECTION */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 60px 80px 100px 80px;
  /* Cream gradient matching image_d6d482.png */
  background: linear-gradient(180deg, #fffef9 0%, #fdf3dc 100%); 
  position: relative;
  overflow: hidden;
}

.hero-content {
  max-width: 550px;
  z-index: 2;
}

.badge-hello {
  background: #fbe5cc;
  color: #d97706;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 25px;
}

.hero-content h1 {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.2;
  color: #2d2d2d;
  margin-bottom: 30px;
}

.hero-buttons {
  display: flex;
  gap: 20px;
}

.btn-main {
  padding: 15px 32px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-yellow {
  background: #f4b400;
  color: #fff;
  border: none;
  box-shadow: 0 5px 15px rgba(244, 180, 0, 0.4);
}

.btn-yellow:hover {
  background: #dba100;
}

.btn-white {
  background: #fff;
  color: #333;
  border: 2px solid #222;
}

.btn-white:hover {
  background: #f5f5f5;
}

/* HERO IMAGE AREA WITH FLOATING BADGES */
.hero-image-container {
  position: relative;
  width: 500px;
  height: 450px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

/* Yellow circular blob behind user image */
.yellow-shape {
  position: absolute;
  width: 400px;
  height: 400px;
  background-color: #eab308;
  border-radius: 50% 50% 30% 70% / 50% 60% 40% 50%; /* Organic round shape */
  bottom: 20px;
  z-index: 1;
}

.user-photo {
  width: 360px;
  z-index: 2;
  position: relative;
  pointer-events: none;
}

/* Floating Badges */
.floating-badge {
  position: absolute;
  background: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 14px;
  z-index: 3;
}

.badge-tech {
  top: 80px;
  right: 10px;
  color: #4f46e5;
}

.badge-design {
  bottom: 140px;
  right: -20px;
  color: #ec4899;
}

/* CASE STUDIES / PORTFOLIO BOTTOM SECTION */
.case-studies {
  background: #f8fafc;
  padding: 60px 80px;
}

.case-studies h2 {
  font-size: 32px;
  font-weight: 800;
  color: #1e293b;
  margin-bottom: 20px;
}

/* RESPONSIVENESS */
@media(max-width: 992px) {
  nav { padding: 20px; }
  nav ul { display: none; } /* Kept simple for preview */
  .hero { flex-direction: column; text-align: center; padding: 40px 20px; }
  .hero-content { margin-bottom: 50px; }
  .hero-buttons { justify-content: center; }
  .hero-image-container { width: 100%; }
  .badge-design { right: 20px; }
}
</style>
</head>
<body>

<div class="page-wrapper">

  <!-- NAVBAR -->
  <nav>
    <div class="logo">Hassan<span>.ai</span></div>
    <ul>
      <li><a href="#">AboutMe</a></li>
      <li><a href="#">Skills</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">CaseStudies</a></li>
      <li><a href="#">Experience</a></li>
      <li><a href="mailto:hassanrz503@gmail.com" class="btn-coffee"><i class="fa-solid fa-envelope"></i> Hire Me</a></li>
    </ul>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    
    <div class="hero-content">
      <div class="badge-hello">
        👋 Hello All
      </div>
      <h1>
        I'm Hassan Raza,<br>
        A Problem solver<br>
        and AI Engineer
      </h1>
      
      <div class="hero-buttons">
        <a href="#" class="btn-main btn-yellow">About me <i class="fa-solid fa-circle-arrow-right"></i></a>
        <a href="mailto:hassanrz503@gmail.com" class="btn-main btn-white">Contact Me</a>
      </div>
    </div>

    <!-- HERO IMAGE AREA WITH EXACT BADGES FROM IMAGE -->
    <div class="hero-image-container">
      <!-- Background Yellow Shape -->
      <div class="yellow-shape"></div>
      
      <!-- Hassan's Image -->
      <img src="hassan photo.png" alt="Hassan Raza" class="user-photo">
      
      <!-- Tech Floating Badge -->
      <div class="floating-badge badge-tech">
        <span>🔔</span> TECH
      </div>
      
      <!-- Design/Analytics Floating Badge -->
      <div class="floating-badge badge-design">
        <span>🎨</span> DATA
      </div>
    </div>

  </section>

  <!-- RECENT CASE STUDIES SECTION -->
  <section class="case-studies">
    <h2>My Recent Projects</h2>
    <!-- Baki ka projects data yahan dynamically aa sakta hai -->
  </section>

</div>

</body>
</html>
